<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Deck of Theseus</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=Cinzel+Decorative:wght@700;900&display=swap');

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #08060e;
      color: #d4c5a0;
      font-family: 'Cinzel', serif;
      display: flex;
      flex-direction: column;
    }

    /* ══════════════════════════════════════
       STATUS BAR (10%)
       ══════════════════════════════════════ */

    .status-bar {
      height: 10%;
      background:
        linear-gradient(180deg, #18122a 0%, #120e20 60%, #0e0a18 100%);
      border-bottom: none;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 28px;
      gap: 16px;
      position: relative;
      box-shadow:
        inset 0 1px 0 0 rgba(197, 150, 26, 0.15),
        inset 0 -1px 0 0 rgba(0, 0, 0, 0.6);
    }

    .status-bar::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 4%;
      right: 4%;
      height: 2px;
      background: linear-gradient(90deg, transparent, #6b5a28 15%, #c5961a 35%, #e8c850 50%, #c5961a 65%, #6b5a28 85%, transparent);
    }

    .status-bar .stat-group {
      display: flex;
      align-items: center;
      gap: 20px;
    }

    /* ── HP Display ── */

    .hp-display {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .hp-display::before {
      content: '\2665';
      font-size: 18px;
      color: #bf2040;
      filter: drop-shadow(0 0 5px rgba(191, 32, 64, 0.6));
      margin-right: 2px;
    }

    .hp-bar-track {
      width: 130px;
      height: 16px;
      background:
        linear-gradient(180deg, #0a0610, #15101e, #0a0610);
      border: none;
      border-radius: 0;
      overflow: hidden;
      position: relative;
      clip-path: polygon(4px 0%, calc(100% - 4px) 0%, 100% 50%, calc(100% - 4px) 100%, 4px 100%, 0% 50%);
      box-shadow:
        0 0 0 1px #4a2030,
        0 0 6px rgba(160, 30, 50, 0.2);
    }

    .hp-bar-track::before {
      content: '';
      position: absolute;
      inset: 0;
      border: 1px solid rgba(191, 32, 64, 0.4);
      clip-path: polygon(4px 0%, calc(100% - 4px) 0%, 100% 50%, calc(100% - 4px) 100%, 4px 100%, 0% 50%);
      z-index: 2;
    }

    .hp-bar-fill {
      width: 75%;
      height: 100%;
      background:
        linear-gradient(180deg, #cc2244, #9b1b30 40%, #7a1528 70%, #5a1020);
      box-shadow:
        inset 0 1px 2px rgba(255, 100, 120, 0.4),
        0 0 8px rgba(155, 27, 48, 0.5);
      position: relative;
    }

    .hp-bar-fill::after {
      content: '';
      position: absolute;
      top: 2px;
      left: 4px;
      right: 10%;
      height: 3px;
      background: linear-gradient(90deg, rgba(255, 160, 170, 0.4), transparent);
      border-radius: 1px;
    }

    .hp-text {
      font-size: 12px;
      font-weight: 700;
      color: #d4a0a8;
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.8);
    }

    /* ── Gold Display ── */

    .gold-display {
      font-size: 13px;
      font-weight: 700;
      color: #d4a520;
      text-shadow: 0 0 6px rgba(212, 165, 32, 0.3), 0 1px 2px rgba(0, 0, 0, 0.8);
    }

    /* ── Floor Display ── */

    .floor-display {
      font-size: 12px;
      font-weight: 700;
      color: #8a7a60;
      letter-spacing: 1px;
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.8);
    }

    /* ── Relic Slots ── */

    .relics {
      display: flex;
      gap: 8px;
    }

    .relic-slot {
      width: 30px;
      height: 30px;
      background:
        radial-gradient(circle at 40% 35%, #1e1830, #0e0a18);
      border: none;
      border-radius: 0;
      clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
      position: relative;
      box-shadow: 0 0 6px rgba(100, 80, 140, 0.2);
    }

    .relic-slot::before {
      content: '';
      position: absolute;
      inset: 0;
      clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
      border: 1px solid rgba(140, 120, 180, 0.3);
    }

    /* ══════════════════════════════════════
       ARENA (50%)
       ══════════════════════════════════════ */

    .arena {
      height: 50%;
      background:
        radial-gradient(ellipse at 50% 90%, rgba(30, 22, 40, 0.9), transparent 60%),
        radial-gradient(ellipse at 20% 30%, rgba(20, 15, 35, 0.5), transparent 50%),
        radial-gradient(ellipse at 80% 40%, rgba(15, 20, 30, 0.4), transparent 50%),
        linear-gradient(180deg, #08060e 0%, #0c0a14 40%, #100e1c 70%, #14101e 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    #gameCanvas {
      position: absolute;
      width: 100%;
      height: 100%;
      z-index: 0;
    }

    .combatants {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-around;
      z-index: 1;
      padding: 0 100px;
    }

    /* ── Player Sprite (Armored Warrior) ── */

    .player-sprite {
      width: 72px;
      height: 105px;
      position: relative;
      overflow: visible;
      background:
        linear-gradient(170deg, #8a6a40 0%, #6a4a28 15%, #5a3a20 35%, #4a2e18 55%, #3a2210 80%, #2a1808 100%);
      border: none;
      border-radius: 6px 6px 2px 2px;
      box-shadow:
        inset 2px 2px 6px rgba(160, 120, 60, 0.25),
        inset -2px -2px 6px rgba(0, 0, 0, 0.5),
        inset 0 0 15px rgba(0, 0, 0, 0.3),
        0 4px 12px rgba(0, 0, 0, 0.6);
      filter: drop-shadow(0 0 18px rgba(160, 120, 50, 0.2));
    }

    .player-sprite::before {
      content: '';
      position: absolute;
      top: -28px;
      left: 50%;
      transform: translateX(-50%);
      width: 30px;
      height: 32px;
      background:
        radial-gradient(circle at 45% 38%, #907050, #6a4a30 50%, #4a3220);
      border-radius: 42% 42% 38% 38%;
      box-shadow:
        0 -5px 0 4px #5a3a20,
        0 -9px 0 4px #7a5a38,
        0 -11px 3px 3px rgba(140, 100, 50, 0.3),
        inset 0 6px 10px rgba(0, 0, 0, 0.45),
        0 2px 8px rgba(0, 0, 0, 0.6);
    }

    .player-sprite::after {
      content: '';
      position: absolute;
      top: -14px;
      left: -20px;
      width: 7px;
      height: 80px;
      background:
        linear-gradient(180deg, #d4c090, #b0a070 10%, #8a7a55 30%, #a09060 50%, #8a7a55 70%, #6a5a3a 90%, #4a3a20);
      border-radius: 2px 2px 1px 1px;
      transform: rotate(-6deg);
      box-shadow:
        inset 1px 0 2px rgba(220, 200, 150, 0.35),
        inset -1px 0 2px rgba(0, 0, 0, 0.4),
        0 0 8px rgba(180, 150, 80, 0.15),
        0 2px 4px rgba(0, 0, 0, 0.4);
    }

    /* ── Enemy: Slime King ── */

    .enemy-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
    }

    .enemy-intent {
      font-family: 'Cinzel Decorative', serif;
      font-size: 13px;
      font-weight: 700;
      color: #d4a0a8;
      background:
        linear-gradient(180deg, rgba(90, 25, 35, 0.6), rgba(50, 15, 22, 0.8));
      border: none;
      border-radius: 0;
      padding: 5px 16px;
      clip-path: polygon(8px 0%, calc(100% - 8px) 0%, 100% 50%, calc(100% - 8px) 100%, 8px 100%, 0% 50%);
      text-shadow: 0 0 6px rgba(200, 80, 100, 0.5);
      position: relative;
      box-shadow: 0 0 10px rgba(140, 30, 50, 0.3);
    }

    .enemy-intent::before {
      content: '';
      position: absolute;
      inset: 0;
      clip-path: polygon(8px 0%, calc(100% - 8px) 0%, 100% 50%, calc(100% - 8px) 100%, 8px 100%, 0% 50%);
      border: 1px solid rgba(200, 80, 100, 0.35);
    }

    .enemy-sprite {
      width: 130px;
      height: 118px;
      background:
        radial-gradient(circle at 25% 55%, rgba(100, 240, 150, 0.25), transparent 35%),
        radial-gradient(circle at 75% 65%, rgba(60, 210, 120, 0.2), transparent 30%),
        radial-gradient(circle at 50% 25%, rgba(120, 255, 160, 0.12), transparent 28%),
        radial-gradient(circle at 40% 75%, rgba(80, 200, 100, 0.15), transparent 25%),
        radial-gradient(ellipse at 50% 55%, #40c068 0%, #30a855 20%, #228a42 40%, #186a32 60%, #105025 80%, #0a3818);
      border: none;
      border-radius: 44% 56% 62% 38% / 38% 34% 66% 62%;
      box-shadow:
        inset 0 -8px 20px rgba(0, 0, 0, 0.3),
        inset 0 4px 12px rgba(120, 255, 160, 0.08);
      position: relative;
      overflow: visible;
      animation: slime-pulse 3.5s ease-in-out infinite;
      filter: drop-shadow(0 0 22px rgba(50, 180, 90, 0.35)) drop-shadow(0 8px 16px rgba(0, 0, 0, 0.5));
    }

    .enemy-sprite::before,
    .enemy-sprite::after {
      content: '';
      position: absolute;
      width: 20px;
      height: 26px;
      background:
        radial-gradient(ellipse at 50% 42%, #f5eed0, #e8dca0 40%, #c0aa60 80%);
      border-radius: 42% 42% 50% 50%;
      top: 22%;
      z-index: 2;
      box-shadow:
        inset 0 10px 0 6px #0e2210,
        0 0 10px rgba(245, 238, 208, 0.4),
        0 0 20px rgba(200, 180, 80, 0.15);
    }

    .enemy-sprite::before {
      left: 22%;
      transform: rotate(-4deg);
    }

    .enemy-sprite::after {
      right: 22%;
      transform: rotate(4deg);
    }

    /* ══════════════════════════════════════
       CONTROL DECK (40%)
       ══════════════════════════════════════ */

    .control-deck {
      height: 40%;
      background:
        linear-gradient(180deg, #0e0a18 0%, #140f22 40%, #18122a 100%);
      border-top: none;
      display: flex;
      align-items: center;
      padding: 0 24px;
      gap: 16px;
      position: relative;
      box-shadow:
        inset 0 1px 0 0 rgba(0, 0, 0, 0.5),
        inset 0 2px 0 0 rgba(197, 150, 26, 0.1);
    }

    .control-deck::before {
      content: '';
      position: absolute;
      top: 0;
      left: 4%;
      right: 4%;
      height: 2px;
      background: linear-gradient(90deg, transparent, #6b5a28 15%, #c5961a 35%, #e8c850 50%, #c5961a 65%, #6b5a28 85%, transparent);
    }

    /* ── Energy Gem ── */

    .deck-info-left {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      min-width: 80px;
    }

    .energy-orb {
      width: 62px;
      height: 62px;
      border-radius: 0;
      background:
        radial-gradient(circle at 38% 32%, #f0d860, #d4a520 30%, #a87818 55%, #7a5510 80%, #503a0a);
      border: none;
      clip-path: polygon(50% 0%, 93% 25%, 93% 75%, 50% 100%, 7% 75%, 7% 25%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Cinzel Decorative', serif;
      font-size: 14px;
      font-weight: 700;
      color: #1a1008;
      text-shadow: 0 1px 1px rgba(240, 216, 96, 0.5);
      position: relative;
      filter: drop-shadow(0 0 10px rgba(212, 165, 32, 0.35));
      animation: gem-glow 4s ease-in-out infinite;
    }

    .energy-orb::before {
      content: '';
      position: absolute;
      top: 12%;
      left: 20%;
      width: 35%;
      height: 20%;
      background: linear-gradient(160deg, rgba(255, 240, 180, 0.5), transparent);
      border-radius: 50%;
    }

    .pile-counter {
      font-size: 10px;
      font-weight: 700;
      color: #7a6a50;
      text-align: center;
      line-height: 1.5;
      letter-spacing: 1px;
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.8);
    }

    .pile-counter span {
      display: block;
      font-family: 'Cinzel Decorative', serif;
      font-size: 18px;
      color: #b0a080;
    }

    /* ── Hand of Cards ── */

    .hand {
      flex: 1;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      gap: 10px;
      padding-bottom: 12px;
      height: 100%;
      min-width: 0;
      overflow: visible;
    }

    /* ── Card Base ── */

    .card {
      width: 124px;
      height: 178px;
      background:
        linear-gradient(180deg, #1e1828 0%, #18122a 30%, #140e22 70%, #100a1a 100%);
      border: 2px solid #4a3a20;
      border-radius: 3px;
      display: flex;
      flex-direction: column;
      cursor: pointer;
      transition: transform 0.25s ease, filter 0.25s ease;
      flex-shrink: 0;
      position: relative;
      overflow: hidden;
      box-shadow:
        inset 1px 1px 0 0 rgba(160, 130, 60, 0.2),
        inset -1px -1px 0 0 rgba(0, 0, 0, 0.5),
        0 2px 8px rgba(0, 0, 0, 0.6);
    }

    .card::before,
    .card::after {
      content: '\25C6';
      position: absolute;
      font-size: 5px;
      color: rgba(160, 130, 60, 0.45);
      z-index: 5;
    }

    .card::before {
      top: 3px;
      left: 4px;
    }

    .card::after {
      bottom: 3px;
      right: 4px;
    }

    .card:hover {
      transform: translateY(-28px) scale(1.03);
      filter: brightness(1.15);
      z-index: 10;
      border-color: #8a7030;
      box-shadow:
        inset 1px 1px 0 0 rgba(200, 170, 80, 0.3),
        inset -1px -1px 0 0 rgba(0, 0, 0, 0.4),
        0 8px 24px rgba(140, 110, 40, 0.25),
        0 0 12px rgba(160, 130, 50, 0.15);
    }

    /* ── Card Header ── */

    .card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 7px 8px 6px;
      border-bottom: none;
      position: relative;
    }

    .card-header::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 10%;
      right: 10%;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(160, 130, 60, 0.35), transparent);
    }

    .card-title {
      font-family: 'Cinzel', serif;
      font-size: 10px;
      font-weight: 700;
      color: #d4c5a0;
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.8);
    }

    .card-cost {
      width: 22px;
      height: 22px;
      border-radius: 0;
      clip-path: polygon(50% 0%, 100% 50%, 50% 100%, 0% 50%);
      background:
        radial-gradient(circle at 40% 35%, #f0d860, #c5961a 50%, #7a5510);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Cinzel Decorative', serif;
      font-size: 10px;
      font-weight: 700;
      color: #1a1008;
      flex-shrink: 0;
      filter: drop-shadow(0 0 3px rgba(197, 150, 26, 0.4));
    }

    /* ── Card Art (large central area) ── */

    .card-art {
      flex: 1.5;
      margin: 5px 6px;
      border-radius: 2px;
      position: relative;
      overflow: hidden;
    }

    .card-art.attack {
      background:
        radial-gradient(ellipse at 50% 60%, rgba(160, 50, 30, 0.4), transparent 60%),
        radial-gradient(ellipse at 30% 30%, rgba(200, 80, 20, 0.2), transparent 50%),
        linear-gradient(150deg, #3a1510 0%, #2a0e08 40%, #1a0804 100%);
      border: 1px solid #5a2518;
      box-shadow:
        inset 0 0 12px rgba(160, 40, 20, 0.2),
        inset 1px 1px 0 rgba(100, 40, 20, 0.15),
        inset -1px -1px 0 rgba(0, 0, 0, 0.3);
    }

    .card-art.attack::before {
      content: '';
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at 55% 45%, rgba(255, 120, 40, 0.08), transparent 50%),
        linear-gradient(45deg, transparent 40%, rgba(180, 60, 20, 0.06) 50%, transparent 60%);
    }

    .card-art.skill {
      background:
        radial-gradient(ellipse at 50% 50%, rgba(40, 80, 160, 0.3), transparent 60%),
        radial-gradient(ellipse at 70% 30%, rgba(60, 100, 180, 0.15), transparent 50%),
        linear-gradient(150deg, #10203a 0%, #0a1828 40%, #060e1a 100%);
      border: 1px solid #1a3a5a;
      box-shadow:
        inset 0 0 12px rgba(40, 80, 160, 0.15),
        inset 1px 1px 0 rgba(40, 70, 120, 0.15),
        inset -1px -1px 0 rgba(0, 0, 0, 0.3);
    }

    .card-art.skill::before {
      content: '';
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at 45% 40%, rgba(100, 160, 255, 0.06), transparent 50%),
        linear-gradient(135deg, transparent 40%, rgba(60, 100, 180, 0.05) 50%, transparent 60%);
    }

    /* ── Card Description ── */

    .card-desc {
      padding: 6px 8px 4px;
      font-size: 9px;
      font-weight: 400;
      color: #a09880;
      border-top: none;
      line-height: 1.45;
      position: relative;
    }

    .card-desc::before {
      content: '\2014\00a0\2726\00a0\2014';
      display: block;
      text-align: center;
      font-size: 7px;
      color: rgba(160, 130, 60, 0.4);
      margin-bottom: 3px;
      letter-spacing: 2px;
    }

    .card-type {
      font-family: 'Cinzel', serif;
      font-size: 7px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: #5a4a30;
      padding: 0 8px 5px;
      text-shadow: 0 1px 1px rgba(0, 0, 0, 0.5);
    }

    /* ── End Turn & Discard ── */

    .deck-info-right {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      min-width: 100px;
    }

    .end-turn-btn {
      font-family: 'Cinzel Decorative', serif;
      font-size: 11px;
      font-weight: 700;
      color: #d4c5a0;
      letter-spacing: 1px;
      background:
        linear-gradient(180deg, #6a2028 0%, #4a1520 40%, #3a1018 70%, #2a0a10 100%);
      border: 2px solid #6a3020;
      border-radius: 2px;
      padding: 14px 22px;
      cursor: pointer;
      transition: border-color 0.2s, filter 0.2s;
      position: relative;
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.8);
      box-shadow:
        inset 1px 1px 0 0 rgba(180, 80, 60, 0.2),
        inset -1px -1px 0 0 rgba(0, 0, 0, 0.5),
        0 2px 10px rgba(80, 20, 20, 0.4);
    }

    .end-turn-btn::before {
      content: '\25C6';
      position: absolute;
      left: 8px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 5px;
      color: rgba(180, 80, 60, 0.4);
    }

    .end-turn-btn::after {
      content: '\25C6';
      position: absolute;
      right: 8px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 5px;
      color: rgba(180, 80, 60, 0.4);
    }

    .end-turn-btn:hover {
      border-color: #9a4030;
      filter: brightness(1.2);
      box-shadow:
        inset 1px 1px 0 0 rgba(200, 100, 80, 0.3),
        inset -1px -1px 0 0 rgba(0, 0, 0, 0.4),
        0 0 16px rgba(120, 30, 30, 0.4);
    }

    /* ══════════════════════════════════════
       ANIMATIONS
       ══════════════════════════════════════ */

    @keyframes slime-pulse {
      0%, 100% {
        border-radius: 48% 52% 58% 42% / 42% 38% 62% 58%;
        transform: scale(1);
      }
      25% {
        border-radius: 52% 48% 54% 46% / 46% 42% 58% 54%;
      }
      50% {
        border-radius: 46% 54% 52% 48% / 50% 44% 56% 50%;
        transform: scale(1.03);
      }
      75% {
        border-radius: 50% 50% 56% 44% / 44% 40% 60% 56%;
      }
    }

    @keyframes gem-glow {
      0%, 100% { filter: drop-shadow(0 0 10px rgba(212, 165, 32, 0.3)); }
      50% { filter: drop-shadow(0 0 16px rgba(232, 200, 80, 0.45)); }
    }
  </style>
</head>
<body>

  <!-- Top Band: Status Bar -->
  <div class="status-bar">
    <div class="stat-group">
      <div class="hp-display">
        <div class="hp-bar-track">
          <div class="hp-bar-fill"></div>
        </div>
        <span class="hp-text">60/80</span>
      </div>
      <span class="gold-display">&#x1F4B0; 150</span>
    </div>
    <span class="floor-display">Act 1 &mdash; Floor 4</span>
    <div class="relics">
      <div class="relic-slot"></div>
      <div class="relic-slot"></div>
      <div class="relic-slot"></div>
    </div>
  </div>

  <!-- Middle Band: Arena -->
  <div class="arena">
    <canvas id="gameCanvas"></canvas>
    <div class="combatants">
      <div class="player-sprite"></div>
      <div class="enemy-container">
        <div class="enemy-intent">&#x2694;&#xFE0F; 12</div>
        <div class="enemy-sprite"></div>
      </div>
    </div>
  </div>

  <!-- Bottom Band: Control Deck -->
  <div class="control-deck">

    <div class="deck-info-left">
      <div class="energy-orb">3/3</div>
      <div class="pile-counter">Draw<span>12</span></div>
    </div>

    <div class="hand">
